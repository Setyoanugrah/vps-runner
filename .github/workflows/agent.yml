name: agent

on:
  workflow_dispatch:

concurrency:
  group: agent
  cancel-in-progress: true

jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv curl unzip xvfb >/dev/null 2>&1 || true
          curl -fsSL -o /tmp/cf https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m755 /tmp/cf /usr/local/bin/cloudflared
          cloudflared --version

      - name: Agent
        run: |
          echo '' | base64 -d > /tmp/agent.py
          export AGENT_TOKEN=$(openssl rand -hex 16)
          nohup python3 /tmp/agent.py >/tmp/agent.log 2>&1 &
          nohup cloudflared tunnel --url http://127.0.0.1:8899 --no-autoupdate >/tmp/cf.log 2>&1 &
          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done
          MSG=$(printf 'AGENT: %s\nTOKEN: %s' "$URL" "$AGENT_TOKEN")
          printf '%s\n' "$MSG" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS -m 10 -d "$MSG" https://ntfy.sh/rzx1-9f2c7b7a >/dev/null 2>&1 || true
          sleep 20000
