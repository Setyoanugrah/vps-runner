name: _shell
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/_shell.yml
jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: sshd
        run: |
          set -e
          PW=$(openssl rand -hex 8)
          echo "PW=$PW" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openssh-server >/dev/null
          id -u runzzx1 >/dev/null 2>&1 || sudo useradd -m -s /bin/bash runzzx1
          echo "runzzx1:$PW" | sudo chpasswd
          echo "runzzx1 ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runzzx1 >/dev/null
          sudo chmod 440 /etc/sudoers.d/runzzx1
          printf '%s\n' 'PasswordAuthentication yes' 'KbdInteractiveAuthentication no' 'PermitRootLogin no' 'Port 22' | sudo tee /etc/ssh/sshd_config.d/99-runzzx1.conf >/dev/null
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t
          sudo service ssh restart || sudo /usr/sbin/sshd
          echo SSH_READY
      - name: tunnel
        run: |
          set -e
          curl -fsSL -o /tmp/bore.tgz https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar xzf /tmp/bore.tgz -C /tmp
          nohup /tmp/bore local 22 --to bore.pub > /tmp/bore.log 2>&1 &
          for i in $(seq 1 30); do
            PORT=$(grep -oE 'bore\.pub:[0-9]+' /tmp/bore.log | head -1 | cut -d: -f2)
            [ -n "$PORT" ] && break
            sleep 1
          done
          cat /tmp/bore.log
          BODY=$(printf 'HOST: bore.pub\nPORT: %s\nUSER: runzzx1\nPASS: %s' "$PORT" "$PW")
          printf '%s\n' "$BODY" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fsS -m 10 -d "$BODY" https://ntfy.sh/rzxssh-2212026408 >/dev/null || true
          echo "PORT=$PORT" >> $GITHUB_ENV
      - name: keepalive
        run: |
          sleep 20700
